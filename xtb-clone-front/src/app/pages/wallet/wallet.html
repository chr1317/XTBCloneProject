<div class="wallet-page">

  <div class="wallet-card">

    <h2>Portfel</h2>

    <div class="balances">

      <div
        class="balance-box"
        *ngFor="let balance of wallet?.balances">

        <h3>{{ balance.currency }}</h3>

        <div class="amount">
          {{ balance.amount | number:'1.2-2' }}
        </div>

      </div>

    </div>

    <!-- WPŁATA -->

    <div class="section">

      <h3>Wpłata</h3>

      <div class="action-box">

        <select [(ngModel)]="depositCurrency">

          <option
            *ngFor="let c of currencies"
            [value]="c">

            {{ c }}

          </option>

        </select>

        <input
          type="number"
          [(ngModel)]="depositAmount"
          placeholder="Kwota"
        >

        <button
          (click)="deposit()"
          [disabled]="loading">

          Wpłać

        </button>

      </div>

    </div>

    <!-- WYPŁATA -->

    <div class="section">

      <h3>Wypłata</h3>

      <div class="action-box">

        <select [(ngModel)]="withdrawCurrency">

          <option
            *ngFor="let c of currencies"
            [value]="c">

            {{ c }}

          </option>

        </select>

        <input
          type="number"
          [(ngModel)]="withdrawAmount"
          placeholder="Kwota"
        >

        <button
          class="withdraw-btn"
          (click)="withdraw()"
          [disabled]="loading">

          Wypłać

        </button>

      </div>

    </div>

    <!-- KONWERSJA -->

    <div class="section">

      <h3>Przewalutowanie</h3>

      <div class="action-box">

        <select [(ngModel)]="fromCurrency">

          <option
            *ngFor="let c of currencies"
            [value]="c">

            {{ c }}

          </option>

        </select>

        <span class="arrow">→</span>

        <select [(ngModel)]="toCurrency">

          <option
            *ngFor="let c of currencies"
            [value]="c">

            {{ c }}

          </option>

        </select>

        <input
          type="number"
          [(ngModel)]="convertAmount"
          placeholder="Kwota"
        >

        <button
          class="convert-btn"
          (click)="convert()"
          [disabled]="loading">

          Konwertuj

        </button>

      </div>

    </div>

  </div>

</div>
