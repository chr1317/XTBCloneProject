<div class="page">

  <div class="header">
    <h2>Instrumenty</h2>
  </div>

  <div class="layout">

    <!-- LISTA -->
    <div class="list">

      <div
        class="card"
        *ngFor="let i of instruments; trackBy: trackById"
        (click)="select(i)"
        [class.active]="selected?.id === i.id">

        <div class="symbol">
          {{ i.symbol }}
        </div>

        <div class="name">
          {{ i.name }}
        </div>

        <div
          class="price"
          [ngClass]="{
            up: i.priceUp,
            down: i.priceDown,
            'flash-up': i.priceUp,
            'flash-down': i.priceDown
          }">

          {{ i.currentPrice | number:'1.2-2' }} USD

        </div>

      </div>

    </div>

    <!-- PANEL -->
    <div class="panel" *ngIf="selected">

      <h3>{{ selected.symbol }}</h3>

      <p>{{ selected.name }}</p>

      <div class="price-big">
        {{ selected.currentPrice | number:'1.2-2' }} USD
      </div>

      <!-- WYKRES -->
      <div class="chart-container">

        <canvas
          baseChart
          [data]="chartData"
          [options]="chartOptions"
          [type]="'line'">
        </canvas>

      </div>

      <div class="actions">
        <input type="number" [(ngModel)]="quantity" min="1" />

        <button
          class="buy"
          (click)="buy()">

          Kup

        </button>


      </div>

    </div>

  </div>

</div>
